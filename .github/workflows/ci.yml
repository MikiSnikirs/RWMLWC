# T-002: сборка частей без файлов игры (Shared, Net, ServerCore, Server, Tests) и юнит-тесты.
# Клиент (Source/Client) требует Assembly-CSharp.dll игры и в CI не собирается.
# Windows: тесты транспорта используют QUIC (System.Net.Quic), он есть в Windows Server 2022+.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Source/Tests/RWMLWC.Tests.csproj -c Release
      - name: Test
        run: dotnet test Source/Tests/RWMLWC.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
